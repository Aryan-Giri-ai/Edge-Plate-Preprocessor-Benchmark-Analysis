   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b41" x="28.86" y="35.244" transform="rotate(-0 28.86 35.244)">SEQUENTIAL AND FOUR-WORKER PIPELINE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b41" x="28.86" y="62.964" transform="rotate(-0 28.86 62.964)">Sequential: one execution thread • one reusable frame slot</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="108.6075" y="108.13245" transform="rotate(-0 108.6075 108.13245)">Fetch</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="108.6075" y="136.769735" transform="rotate(-0 108.6075 136.769735)">Read RGB</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="307.1625" y="108.0387" transform="rotate(-0 307.1625 108.0387)">Gray / Contrast</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="307.1625" y="136.769735" transform="rotate(-0 307.1625 136.769735)">Compute intensity</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="505.7175" y="108.085575" transform="rotate(-0 505.7175 108.085575)">Edges</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="505.7175" y="136.769735" transform="rotate(-0 505.7175 136.769735)">Sobel + binary + closing</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="704.2725" y="108.13245" transform="rotate(-0 704.2725 108.13245)">Output</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="704.2725" y="136.769735" transform="rotate(-0 704.2725 136.769735)">Copy + record</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b41" x="28.86" y="183.2688" transform="rotate(-0 28.86 183.2688)">Frame n completes all four operations before frame n + 1 starts.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b41" x="28.86" y="218.196" transform="rotate(-0 28.86 218.196)">Pipeline: four persistent workers • three bounded queues</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="108.6075" y="266.13645" transform="rotate(-0 108.6075 266.13645)">W1  Fetch</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="108.6075" y="294.773735" transform="rotate(-0 108.6075 294.773735)">Read RGB</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="307.1625" y="266.0427" transform="rotate(-0 307.1625 266.0427)">W2  Gray / Contrast</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="307.1625" y="294.773735" transform="rotate(-0 307.1625 294.773735)">Compute intensity</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="505.7175" y="266.089575" transform="rotate(-0 505.7175 266.089575)">W3  Edges</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="505.7175" y="294.773735" transform="rotate(-0 505.7175 294.773735)">Sobel + binary + closing</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="704.2725" y="266.13645" transform="rotate(-0 704.2725 266.13645)">W4  Output</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="704.2725" y="294.773735" transform="rotate(-0 704.2725 294.773735)">Copy + record</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="206.583" y="270.864" transform="rotate(-0 206.583 270.864)">Q1</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="405.138" y="270.864" transform="rotate(-0 405.138 270.864)">Q2</text>
   </g>
   <g id="text_23">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="603.693" y="270.864" transform="rotate(-0 603.693 270.864)">Q3</text>
   </g>
   <g id="text_24">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="406.44" y="348.48" transform="rotate(-0 406.44 348.48)">Each of Q1, Q2 and Q3 holds up to 5 slot IDs.</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="406.44" y="408.06285" transform="rotate(-0 406.44 408.06285)">Reusable frame pool</text>
   </g>
   <g id="text_26">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="406.44" y="430.213655" transform="rotate(-0 406.44 430.213655)">34 slots; RGB + gray + edge arrays</text>
   </g>
   <g id="text_27">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="614.76" y="381.744" transform="rotate(-0 614.76 381.744)">Release slot</text>
   </g>
   <g id="text_28">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="188.355" y="381.744" transform="rotate(-0 188.355 381.744)">Acquire free slot</text>
   </g>
   <g id="text_29">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(28.86 466.949856)">Different frames may occupy different stages at overlapping times. A single frame still follows W1 → W2 → W3 → W4.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(28.86 480.4272)">Queues transfer IDs, not whole images. Full queues block upstream workers. Workers are not pinned to CPU cores.</text>
   </g>
  </g>
