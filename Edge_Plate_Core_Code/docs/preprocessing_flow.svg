   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b41" x="25.605" y="35.244" transform="rotate(-0 25.605 35.244)">PREPROCESSING: SAME PIXELS, SAME RULES IN BOTH MODES</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b41" x="25.605" y="58.5288" transform="rotate(-0 25.605 58.5288)">Default source profile • RGB input • threshold 80 • full 3 × 3 closing</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="141.1575" y="119.77485" transform="rotate(-0 141.1575 119.77485)">1  RGB frame</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(71.091875 146.187744)">Fetch a decoded RGB frame</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(76.177031 159.285166)">from an EPRAW replay file</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="404.8125" y="119.727975" transform="rotate(-0 404.8125 119.727975)">2  Grayscale + contrast</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(354.549219 146.187744)">Integer luminance Y</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(327.409375 159.285166)">then fixed contrast adjustment</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="668.4675" y="119.77485" transform="rotate(-0 668.4675 119.77485)">3  Sobel Gx</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(593.394063 146.187744)">Absolute horizontal derivative</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(596.99875 159.285166)">responding to vertical edges</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="668.4675" y="269.415975" transform="rotate(-0 668.4675 269.415975)">4  Binary threshold</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(609.201875 295.758557)">|Gx| ≥ 80 becomes 255</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(639.2175 309.134103)">otherwise 0</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="404.8125" y="269.415975" transform="rotate(-0 404.8125 269.415975)">5  Morphological closing</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(345.230469 295.875744)">3 × 3 dilation → erosion</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(334.071875 308.973166)">connects nearby foreground</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142b41" x="141.1575" y="269.46285" transform="rotate(-0 141.1575 269.46285)">6  Output</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(86.560625 295.875744)">Copy final edge plane</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(66.136406 308.973166)">fingerprint + record + recycle</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b41" x="28.86" y="370.656" transform="rotate(-0 28.86 370.656)">Worker mapping: 1 = Fetch  |  2 = Gray/Contrast  |  3 = Sobel + Threshold + Closing  |  4 = Output</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(28.86 389.333856)">An edge map is a preprocessing output. This engine does not locate a plate or recognize its characters.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #142b41" transform="translate(28.86 402.8112)">The Sobel and final image borders are forced to zero. Diagrams describe code structure, not measured timing.</text>
   </g>
  </g>
